# .github/workflows/build-and-package.yml
name: Build & Package Native

on:
  push:
    tags:
      - '*.*'

env:
  APP_NAME: brume
  APP_DESC: "Brume is a pseudonymisation tool, that allows you to use coherent data and production data with GDPR compliance"
  MAINTAINER: "Calgaryp, alexj181"
  CLOUDSMITH_ORG: brume
  CLOUDSMITH_APT_REPO: brume
  CLOUDSMITH_RPM_REPO: brume
  GH_ORG: brumeorg
  GH_REPO: Brume
  TAP_REPO: homebrew-brume

jobs:
  # ── Binaire natif Linux, compilé contre glibc 2.28 (ADR-0064) ───────
  # Oracle Linux 8 : le binaire démarre sur RHEL 8+, Debian 11+, Ubuntu 20.04+. La 2.2,
  # compilée sur ubuntu-latest, exigeait glibc 2.34 (#48a). Même image que `native-build`
  # côté GitLab : le binaire testé en MR est celui qu'on publie.
  native-linux:
    runs-on: ubuntu-latest
    container: container-registry.oracle.com/graalvm/native-image:25-ol8

    steps:
      # Absents de l'image : git pour actions/checkout, gzip pour actions/cache et ./mvnw
      - name: Install git and gzip
        run: microdnf install -y git gzip

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: .m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      # Le tag fait foi : la 2.2 annonçait « brume 2.1 », faute de bump du pom.xml
      - name: Align Maven version with tag
        run: ./mvnw -B -Dmaven.repo.local=.m2/repository versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false

      - name: Build native (AOT + GraalVM)
        run: ./mvnw -B -Dmaven.repo.local=.m2/repository -Pnative native:compile -DskipTests

      - name: Check glibc baseline and version
        run: sh .github/scripts/check-native-binary.sh target/${{ env.APP_NAME }} "${VERSION}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux-amd64
          path: target/${{ env.APP_NAME }}

  # ── Paquets .deb / .rpm et archive Homebrew Linux, depuis le même binaire ──
  build:
    needs: native-linux
    runs-on: ubuntu-latest

    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux-amd64
          path: target/

      # upload-artifact ne conserve pas le bit exécutable, que fpm recopie dans les paquets
      - name: Prepare dist dir
        run: |
          chmod +x target/${{ env.APP_NAME }}
          mkdir -p dist dist-bin

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Install FPM
        run: |
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install fpm

      - name: Package .deb
        run: |
          fpm -s dir -t deb \
            --name ${{ env.APP_NAME }} \
            --version ${{ env.VERSION }} \
            --architecture amd64 \
            --license "Apache-2.0" \
            --description "${{ env.APP_DESC }}" \
            --maintainer "${{ env.MAINTAINER }}" \
            --package dist/${{ env.APP_NAME }}_${{ env.VERSION }}_amd64.deb \
            target/${{ env.APP_NAME }}=/usr/bin/${{ env.APP_NAME }}

      - name: Package .rpm
        run: |
          fpm -s dir -t rpm \
            --name ${{ env.APP_NAME }} \
            --version ${{ env.VERSION }} \
            --architecture x86_64 \
            --license "Apache-2.0" \
            --description "${{ env.APP_DESC }}" \
            --maintainer "${{ env.MAINTAINER }}" \
            --package dist/${{ env.APP_NAME }}_${{ env.VERSION }}_x86_64.rpm \
            target/${{ env.APP_NAME }}=/usr/bin/${{ env.APP_NAME }}

      # Binaire à la racine, comme l'attend la formule (`bin.install`). Remplace l'archive
      # fpm (usr/bin/brume) du même nom, qui écrasait celle-ci dans la release 2.2.
      - name: Package tar.gz (binaire à la racine pour Homebrew)
        run: |
          tar -czf dist-bin/${{ env.APP_NAME }}_${VERSION}_linux_amd64.tar.gz \
            -C target ${{ env.APP_NAME }}

      # ← AJOUTÉ : sans ça, le job publish ne trouve pas l'artefact "packages"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: bin_linux_amd64
          path: dist-bin/*.tar.gz

  # ── Installation des paquets sur les distributions supportées (ADR-0064) ──
  # dpkg / rpm sur le fichier local, sans dépôt, puis `brume --version` : un paquet qui ne
  # s'installe pas ou un binaire qui ne démarre pas (glibc) bloque Cloudsmith et Homebrew.
  # Planchers glibc 2.28 (RHEL 8) et 2.31 (Debian 11, Ubuntu 20.04), plus les dernières.
  package-smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: registry.access.redhat.com/ubi8/ubi-minimal:8.10
            install: rpm -i /dist/*.rpm
          - image: registry.access.redhat.com/ubi9/ubi-minimal
            install: rpm -i /dist/*.rpm
          - image: debian:11-slim
            install: dpkg -i /dist/*.deb
          - image: debian:13-slim
            install: dpkg -i /dist/*.deb
          - image: ubuntu:20.04
            install: dpkg -i /dist/*.deb
          - image: ubuntu:24.04
            install: dpkg -i /dist/*.deb

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Install and run on ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" -e VERSION "${{ matrix.image }}" sh -ec '
            ${{ matrix.install }}
            out=$(${{ env.APP_NAME }} --version)
            echo "$out"
            [ "$out" = "${{ env.APP_NAME }} $VERSION" ] || { echo "attendu « ${{ env.APP_NAME }} $VERSION »" >&2; exit 1; }'

  publish:
    needs: [build, package-smoke]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Install Cloudsmith CLI
        run: pip install cloudsmith-cli

      - name: Publish .deb → Cloudsmith APT
        run: |
          cloudsmith push deb \
            ${{ env.CLOUDSMITH_ORG }}/${{ env.CLOUDSMITH_APT_REPO }}/any-distro/any-version \
            dist/${{ env.APP_NAME }}_${{ env.VERSION }}_amd64.deb
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}

      - name: Publish .rpm → Cloudsmith RPM
        run: |
          cloudsmith push rpm \
            ${{ env.CLOUDSMITH_ORG }}/${{ env.CLOUDSMITH_RPM_REPO }}/any-distro/any-version \
            dist/${{ env.APP_NAME }}_${{ env.VERSION }}_x86_64.rpm
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      # ← SUPPRIMÉ : étape "Publish .apk" (plus de .apk produit → push en échec)

  # ── Binaires natifs macOS pour Homebrew (Linux : job native-linux) ───
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
      - name: Align Maven version with tag
        run: ./mvnw -B versions:set -DnewVersion="${GITHUB_REF_NAME}" -DgenerateBackupPoms=false
      - name: Build native
        run: ./mvnw -Pnative native:compile -DskipTests
      - name: Check version
        run: sh .github/scripts/check-native-binary.sh target/${{ env.APP_NAME }} "${GITHUB_REF_NAME}"
      - name: Package tar.gz (binaire à la racine pour Homebrew)
        run: |
          mkdir -p dist
          tar -czf dist/${{ env.APP_NAME }}_${GITHUB_REF_NAME}_${{ matrix.target }}.tar.gz \
            -C target ${{ env.APP_NAME }}
      - uses: actions/upload-artifact@v4
        with:
          name: bin_${{ matrix.target }}
          path: dist/*.tar.gz

  # ── GitHub Release + mise à jour du tap Homebrew ────────────────────
  homebrew:
    needs: [build-binaries, package-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # bin_* seulement : sans filtre, l'artefact "packages" était fusionné dans le même dossier
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bin_*
          merge-multiple: true
      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/*.tar.gz
      - name: Compute checksums
        run: |
          cd dist
          echo "SHA_LINUX=$(sha256sum ${APP_NAME}_${VERSION}_linux_amd64.tar.gz | cut -d' ' -f1)" >> $GITHUB_ENV
          echo "SHA_ARM=$(sha256sum ${APP_NAME}_${VERSION}_darwin_arm64.tar.gz | cut -d' ' -f1)" >> $GITHUB_ENV
      - name: Update tap
        run: |
          git clone https://x-access-token:${TAP_TOKEN}@github.com/${GH_ORG}/${TAP_REPO}.git tap
          mkdir -p tap/Formula
          cat > tap/Formula/${APP_NAME}.rb << EOF
          class Brume < Formula
            desc "${APP_DESC}"
            homepage "https://github.com/${GH_ORG}/${GH_REPO}"
            version "${VERSION}"
            license "Apache-2.0"
            on_macos do
              on_arm do
                url "https://github.com/${GH_ORG}/${GH_REPO}/releases/download/${VERSION}/${APP_NAME}_${VERSION}_darwin_arm64.tar.gz"
                sha256 "${SHA_ARM}"
              end
            end
            on_linux do
              url "https://github.com/${GH_ORG}/${GH_REPO}/releases/download/${VERSION}/${APP_NAME}_${VERSION}_linux_amd64.tar.gz"
              sha256 "${SHA_LINUX}"
            end
            def install
              bin.install "${APP_NAME}"
            end
            test do
              system "#{bin}/${APP_NAME}", "--version"
            end
          end
          EOF
          cd tap
          git config user.name "CI"
          git config user.email "ci@brumeorg.dev"
          git add Formula/${APP_NAME}.rb
          git commit -m "${APP_NAME} ${VERSION}"
          git push
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
