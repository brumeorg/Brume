# brume.yml — configuration used by the functional E2E journey (ADR-0049)
#
# Copied over the scan output before `brume plan` / `brume execute` on schema e2e_en.
# Changing a strategy here changes the pseudonymized values : regenerate the golden
# dataset (-De2e.updateGolden=true) and review the diff in the MR.
#
# FK columns are deliberately NOT declared (orders.user_id, order_items.order_id,
# order_items.product_id, users.manager_id) : the E2E asserts that FkStrategyPropagator
# carries the parent PK strategy onto them.

extraction:
  # Radius around the declared rows, in both directions (ADR-0050). 1 = the users of the
  # 2025 orders and the products of their items ; 2 would also pull the 2024 order of a
  # user reached at distance 1 (see FkDepthE2E).
  fk_depth: 1
  orphan_policy: KEEP_PARENTS
  fetch_size: 100
  batch_size: 50
  chunk_size: 1000
  tables:
    - table: orders
      filter: "created_at >= '2025-01-01'"
    - table: order_items
      filter: "order_id IN (SELECT id FROM e2e_en.orders WHERE created_at >= '2025-01-01')"
    - table: audit_logs
      filter:

anonymization:
  linked_columns:
    - semantic_key: user_email
      columns:
        - table: users
          column: email
        - table: audit_logs
          column: user_email

  tables:
    - table: users
      columns:
        - name: id
          strategy: FPE_ID
        - name: email
          strategy: FAKE
          type: EMAIL
        - name: first_name
          strategy: FAKE
          type: FIRST_NAME
        - name: last_name
          strategy: FAKE
          type: LAST_NAME
        - name: phone
          strategy: MASK
          type: PHONE
        # FAKE, not HASH : a 64-char HMAC does not fit the VARCHAR(34) IBAN column
        - name: iban
          strategy: FAKE
          type: IBAN
        - name: ip_address
          strategy: MASK
          type: IP_ADDRESS
        - name: address_json
          strategy: FAKE
          type: JSONB
          json_paths:
            - path: "$.street"
              type: ADDRESS
              strategy: FAKE
            - path: "$.city"
              type: ADDRESS
              strategy: MASK
            - path: "$.zip"
              type: ADDRESS
              strategy: HASH
        - name: birth_date
          strategy: FAKE
          type: DATE
        - name: password_hash
          strategy: HASH
        - name: ssn
          strategy: NULLIFY
        - name: gender
          strategy: NULLIFY
        - name: last_login_at
          strategy: DATE_SHIFT

    - table: products
      columns:
        - name: id
          strategy: FPE_ID

    - table: orders
      columns:
        - name: id
          strategy: FPE_ID
        - name: shipping_address
          strategy: FAKE
          type: ADDRESS
        - name: notes
          strategy: NULLIFY

    - table: order_items
      columns:
        - name: id
          strategy: FPE_ID

    - table: audit_logs
      columns:
        - name: id
          strategy: FPE_ID
        - name: user_email
          strategy: FAKE
          type: EMAIL
        - name: ip_address
          strategy: MASK
          type: IP_ADDRESS
        - name: payload
          strategy: FAKE
          type: JSONB
          json_paths:
            - path: "$.user.email"
              type: EMAIL
              strategy: FAKE
            - path: "$.user.session.token"
              strategy: HASH
